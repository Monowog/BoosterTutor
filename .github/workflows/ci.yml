name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  api:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      # Settings() requires this at import time. A fake value is fine here -
      # nothing in the test suite opens a connection.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  web:
    name: Web (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      # $env/static/public is resolved at build time, so the build fails
      # without this - same reason the dev server needed .env.
      PUBLIC_API_URL: https://api.boostertutor.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run build